    <rect x="250" y="180" width="700" height="480" fill="#0f1319" opacity=".18"/>
    <rect x="250" y="180" width="700" height="480" fill="url(#p15)"/>
    <rect x="250" y="180" width="700" height="480" fill="none" stroke="url(#m14)" stroke-width="12"/>
  </g>
    <rect x="635" y="190" width="280" height="460" fill="none" stroke="url(#m16)" stroke-width="9"/>
    <circle cx="670" cy="420" r="11" fill="url(#m16)"/>
