  <linearGradient id="m14" x1="0.117" y1="0.179" x2="0.883" y2="0.821">
    <stop offset="0%"   stop-color="#c8cdd6"/>
    <stop offset="18%"  stop-color="#f2f4f7"/>
    <stop offset="38%"  stop-color="#e7eaee"/>
    <stop offset="52%"  stop-color="#f2f4f7"/>
    <stop offset="78%"  stop-color="#c8cdd6"/>
    <stop offset="100%" stop-color="#8f97a4"/>
  </linearGradient>
  <pattern id="p15" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M0 0 H40 M0 0 V40" stroke="url(#m14)" stroke-width="4"/>
  </pattern>
  <linearGradient id="m16" x1="0.146" y1="0.146" x2="0.854" y2="0.854">
    <stop offset="0%"   stop-color="#c8cdd6"/>
    <stop offset="18%"  stop-color="#f2f4f7"/>
