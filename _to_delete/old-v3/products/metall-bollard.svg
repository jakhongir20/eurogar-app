<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfeff"/>
      <stop offset="100%" stop-color="#e7eff4"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe6ec" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dbe6ec" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  <linearGradient id="m1g" x1="0.000" y1="0.500" x2="1.000" y2="0.500">
    <stop offset="0%"   stop-color="#5b96b4"/>
    <stop offset="18%"  stop-color="#8fc3dc"/>
    <stop offset="38%"  stop-color="#bfe0ef"/>
    <stop offset="52%"  stop-color="#8fc3dc"/>
    <stop offset="78%"  stop-color="#5b96b4"/>
    <stop offset="100%" stop-color="#356c88"/>
  </linearGradient></defs>
<g transform="translate(600 450) scale(1.16) translate(-600 -450)">

    <rect width="1200" height="900" fill="url(#bg)"/>
    <rect width="1200" height="900" fill="url(#spot)"/>
    <rect y="684" width="1200" height="216" fill="url(#floorg)"/>
  <ellipse cx="600" cy="700" rx="190" ry="20" fill="url(#contact)"/>
  <g filter="url(#drop)">
    <rect x="540" y="230" width="120" height="450" rx="60" fill="url(#m1g)"/>
    <rect x="520" y="640" width="160" height="52" rx="14" fill="#2a303b"/>
    <rect x="540" y="290" width="120" height="26" fill="rgb(0 0 0 / .35)"/>
    <rect x="540" y="360" width="120" height="26" fill="rgb(0 0 0 / .35)"/>
    <circle cx="600" cy="248" r="46" fill="url(#m1g)"/>
  </g>
</g>
</svg>